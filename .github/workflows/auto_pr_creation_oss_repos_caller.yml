name: OSS Common Manifest Auto PR Creation Caller

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - test/RDKOSS-1037_oss-auto-pr-test    # ← added for testing
      - 'support/*.*.*'
      - 'support/*.*.*.*'

jobs:
  call_oss_auto_pr_workflow:
    uses: rdk-e/build_tools_workflows/.github/workflows/auto_pr_creation_oss_manifest.yml@RDKOSS-1037_OSS_Auto_PR_Auto_Merge   # TODO: revert to @develop after testing
    secrets:
      rdke_github_token: ${{ secrets.RDKE_GITHUB_TOKEN }}
      rdkcentral_github_token: ${{ secrets.RDKCENTRAL_GITHUB_TOKEN }}